name: Release

# 触发方式：推送 v* 标签，或在 Actions 页面手动触发
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：构建 universal 包，兼容 Apple 芯片与 Intel
          - platform: macos-latest
            target: universal-apple-darwin
          # Windows：产出 .msi 与 .exe(NSIS)
          - platform: windows-latest
            target: x64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "NovelWritingAgent v__VERSION__"
          releaseBody: |
            ## NovelWritingAgent v__VERSION__

            本地优先的 AI 小说创作桌面端 · A local-first, AI-powered novel-writing studio.

            **下载 · Downloads**
            - 🍎 macOS：`*_universal-apple-darwin.app.tar.gz`（含 .dmg / .app，自动更新用）与 `.dmg`
            - 🪟 Windows：`.msi` 安装包 与 `_x64-setup.exe`（NSIS）

            > ⚠️ 安装包尚未做代码签名。首次打开时：
            > macOS 请右键应用图标 → “打开”；Windows 若出现 SmartScreen 提示，点 “More info → Run anyway”。

            > Unsigned builds. On first launch: macOS right-click → Open; Windows SmartScreen → More info → Run anyway.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
